# Deploys the public site (site/, docs/dev/site.md) to Cloudflare Workers with static assets.
#
# Safe in a public repository because:
#   - it runs only on a push to main or by hand on main, never for a pull request, so a stranger's
#     code never sees the token;
#   - the token lives in the 'site-production' environment, which the owner limits to the main branch.
#     A Cloudflare token cannot be limited to one Worker: "Workers Scripts: Edit" reaches every Worker
#     in the account, so the site has an account of its own (DEC-10, docs/dev/site.md);
#   - the packages' code (install scripts, tests, the build) runs only in the build job, which has no
#     environment and no secret. The deploy job, which holds the token, installs Wrangler alone from
#     site/deploy with no install script and runs only that (G-04, scripts/ci/check_site_deploy.py);
#   - it stays off until the repository variable SITE_DEPLOY is 'true', set once the domain exists;
#   - every action is pinned to a commit, so a moved tag cannot run with the token.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'shared/design/**'
      - '.nvmrc'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: vars.SITE_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    # Repository variables: the build job names no environment, so it can read none of its values. These
    # three are printed on the site anyway.
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PRODUCTION: '1'
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_CONTACT_EMAIL: ${{ vars.SITE_CONTACT_EMAIL }}
      SITE_SECURITY_EMAIL: ${{ vars.SITE_SECURITY_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # No cache: what this job builds is what the next one deploys.
      - run: npm ci
      - run: npm test
      # PRODUCTION=1 makes check-dist refuse a build that still has the placeholder domain or addresses.
      - run: npm run build
      - name: Hand the built site, and only that, to the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    needs: build
    if: vars.SITE_DEPLOY == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: site-production
      url: ${{ vars.SITE_URL }}
    defaults:
      run:
        working-directory: site
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      # Wrangler and what it needs, nothing else, at the versions and hashes site/package-lock.json
      # already holds, with no package's install script run. No cache: a cache written by another
      # workflow is not something a job holding a token should read.
      - name: Install Wrangler on its own
        working-directory: site/deploy
        run: npm ci --ignore-scripts
      - name: Take the built site from the build job
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: site-dist
          path: site/dist
      - name: Write the deploy configuration (the real domain and the pilot form's addresses)
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PILOT_FROM: ${{ vars.SITE_PILOT_FROM }}
          PILOT_TO: ${{ vars.SITE_PILOT_TO }}
        run: node scripts/deploy-config.mjs > wrangler.deploy.json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./deploy/node_modules/.bin/wrangler deploy --config wrangler.deploy.json
